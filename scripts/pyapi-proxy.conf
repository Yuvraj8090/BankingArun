# Routes served by the Python backend. Everything absent from this file still
# reaches api.php, so this list is the whole of the migration's blast radius:
# adding a line moves one URL across, deleting it moves the URL back, and the
# PHP handler was never removed.
#
# Included from the SSL vhost. ProxyPass resolves during translate_name, before
# the application's .htaccess rewrites, so a proxied path never reaches PHP.

ProxyPreserveHost On

# Each pair moves one URL to the Python service. A route is only listed here
# once both backends have been asked the same question on the same live
# database and answered with the same bytes.
#
# retry=0 so a restarted worker is retried at once rather than being written off
# for 60 seconds, which would surface as intermittent 503s during a deploy.

# Read-only, unauthenticated, and verified byte-identical against PHP.
ProxyPass /api/public/products http://127.0.0.1:8081/api/public/products retry=0
ProxyPassReverse /api/public/products http://127.0.0.1:8081/api/public/products

# The rate card. Its figures are solved rather than stored, so this one was
# checked twice: 164 rates against PHP before the route existed, then the whole
# response byte for byte against production.
ProxyPass /api/public/schemes http://127.0.0.1:8081/api/public/schemes retry=0
ProxyPassReverse /api/public/schemes http://127.0.0.1:8081/api/public/schemes

# Which services may be offered at all. Small, but it gates what the app shows.
ProxyPass /api/public/features http://127.0.0.1:8081/api/public/features retry=0
ProxyPassReverse /api/public/features http://127.0.0.1:8081/api/public/features

# The branch and ATM locator. First route through the boolean and float column
# handling, which is where the driver difference would have shown.
ProxyPass /api/branches/locator http://127.0.0.1:8081/api/branches/locator retry=0
ProxyPassReverse /api/branches/locator http://127.0.0.1:8081/api/branches/locator

# The owner's payment-rail screen. Config reads and writes, the connectivity
# check, and the in-flight list — verified against PHP on the same database,
# including a secret written by one backend and decrypted by the other.
#
# Settlement is NOT here and must not be added without moving it as one piece:
# /api/rails/webhook and /api/rails/reconcile credit and reverse member
# balances, and the PHP cron runs the same logic every few minutes. Proxying
# either of those alone would leave two implementations of settlement that can
# disagree about whether money moved.
ProxyPass /api/rails/config http://127.0.0.1:8081/api/rails/config retry=0
ProxyPassReverse /api/rails/config http://127.0.0.1:8081/api/rails/config

ProxyPass /api/rails/test http://127.0.0.1:8081/api/rails/test retry=0
ProxyPassReverse /api/rails/test http://127.0.0.1:8081/api/rails/test

ProxyPass /api/rails/transactions http://127.0.0.1:8081/api/rails/transactions retry=0
ProxyPassReverse /api/rails/transactions http://127.0.0.1:8081/api/rails/transactions
