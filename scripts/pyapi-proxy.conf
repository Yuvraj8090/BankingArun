# Routes served by the Python backend. Everything absent from this file still
# reaches api.php, so this list is the whole of the migration's blast radius:
# adding a line moves one URL across, deleting it moves the URL back, and the
# PHP handler was never removed.
#
# Included from the SSL vhost. ProxyPass resolves during translate_name, before
# the application's .htaccess rewrites, so a proxied path never reaches PHP.

ProxyPreserveHost On

# Each pair moves one URL to the Python service. A route is only listed here
# once both backends have been asked the same question on the same live
# database and answered with the same bytes.
#
# retry=0 so a restarted worker is retried at once rather than being written off
# for 60 seconds, which would surface as intermittent 503s during a deploy.

# Read-only, unauthenticated, and verified byte-identical against PHP.
ProxyPass /api/public/products http://127.0.0.1:8081/api/public/products retry=0
ProxyPassReverse /api/public/products http://127.0.0.1:8081/api/public/products
